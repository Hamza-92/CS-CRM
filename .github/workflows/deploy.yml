name: Test and deploy CRM

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-production
  cancel-in-progress: false

env:
  DEPLOY_PATH: /home/u496151366/domains/crm.counterpos.pk/public_html

jobs:
  deploy:
    name: Test, build, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: captain_studio_crm_test
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    environment:
      name: production
      url: https://crm.counterpos.pk

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, pdo_sqlite, sqlite3
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install frontend dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run types

      - name: Run frontend tests
        run: npm test

      - name: Build production assets
        run: npm run build

      - name: Run PHP tests
        run: php artisan test

      - name: Prepare production PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify production environment
        env:
          DEPLOY_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          DEPLOY_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.HOSTINGER_SSH_USER }}
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "test -d '$DEPLOY_PATH' && test -f '$DEPLOY_PATH/.env'"

      - name: Enable maintenance mode
        env:
          DEPLOY_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          DEPLOY_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.HOSTINGER_SSH_USER }}
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && if [ -f artisan ]; then php artisan down --retry=60; fi"

      - name: Upload release
        env:
          DEPLOY_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          DEPLOY_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.HOSTINGER_SSH_USER }}
        run: |
          rsync -az --delete --delay-updates \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='node_modules/' \
            --exclude='storage/' \
            --exclude='public/storage' \
            --exclude='tests/' \
            -e "ssh -p $DEPLOY_PORT" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Finalize Laravel deployment
        env:
          DEPLOY_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          DEPLOY_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.HOSTINGER_SSH_USER }}
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "
            set -e
            cd '$DEPLOY_PATH'
            mkdir -p storage/app/public storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
            chmod -R u+rwX storage bootstrap/cache
            php artisan migrate --force
            php artisan optimize
            php artisan queue:restart
            php artisan up
          "

      - name: Verify deployed website
        run: curl --fail --location --retry 5 --retry-delay 5 --max-time 30 https://crm.counterpos.pk/ > /dev/null

      - name: Leave maintenance mode after a failed deployment
        if: failure()
        env:
          DEPLOY_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          DEPLOY_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.HOSTINGER_SSH_USER }}
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && if [ -f artisan ]; then php artisan up || true; fi" || true
